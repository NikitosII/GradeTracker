# Opt-in local monitoring overlay for DEVELOPMENT.
#
# Adds the same telemetry stack the prod overlay runs (OpenTelemetry collector +
# Jaeger + Prometheus + Grafana) but WITHOUT Caddy/TLS/backups, and publishes the
# UIs to localhost so you can open them directly. Reuses the ops/ configs and the
# provisioned GradeTracker dashboard.
#
# Run it alongside the base + dev override from the repo root. The compose files
# live in docker/, so pin the project directory to the root with
# --project-directory . (otherwise the build context, ./ops mounts and .env
# resolve against docker/ instead of the root):
#
#   docker compose --project-directory . -f docker/docker-compose.yml -f docker/docker-compose.override.yml -f docker/docker-compose.monitoring.yml up --build
#
# Then open Grafana at http://localhost:3000  (admin / admin).

services:
  # Push app telemetry to the in-stack collector (dev leaves OTLP off by default).
  bot-web:
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      Observability__OtlpEndpoint: "http://otel-collector:4317"

  bot-worker:
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      Observability__OtlpEndpoint: "http://otel-collector:4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: unless-stopped
    depends_on:
      - jaeger
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro

  jaeger:
    image: jaegertracing/all-in-one:1.60
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    depends_on:
      - otel-collector
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-dev:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"     # Prometheus UI

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./ops/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data-dev:/loki
    ports:
      - "3100:3100"     # Loki API (dev convenience)

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    depends_on:
      - loki
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./ops/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      # Dev-only convenience credentials; prod uses GRAFANA_ADMIN_PASSWORD.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data-dev:/var/lib/grafana
    ports:
      - "3000:3000"     # Grafana UI

volumes:
  prometheus-data-dev:
  grafana-data-dev:
  loki-data-dev:
