services:
  bot-web:
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      Observability__OtlpEndpoint: "${OTLP_ENDPOINT:-http://otel-collector:4317}"

  bot-worker:
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      Observability__OtlpEndpoint: "${OTLP_ENDPOINT:-http://otel-collector:4317}"

  # --- Reverse proxy + automatic HTTPS --- #
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      bot-web:
        condition: service_healthy
    environment:
      DOMAIN: "${DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL}"
    volumes:
      - ./ops/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # persisted TLS certificates & ACME account
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

  # --- OpenTelemetry collector (single telemetry ingest) --- #
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: unless-stopped
    depends_on:
      - jaeger
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro

  # --- Distributed tracing backend + UI --- #
  jaeger:
    image: jaegertracing/all-in-one:1.60
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # UI bound to loopback only: reach it via SSH tunnel, never public.
      - "127.0.0.1:16686:16686"

  # --- Metrics collection --- #
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    depends_on:
      - otel-collector
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"

  # --- Dashboards --- #
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

  # --- Scheduled database backups ----- #
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      SCHEDULE: "${BACKUP_SCHEDULE:-@daily}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-7}"
      BACKUP_KEEP_WEEKS: "${BACKUP_KEEP_WEEKS:-4}"
      BACKUP_KEEP_MONTHS: "${BACKUP_KEEP_MONTHS:-6}"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - postgres-backups:/backups

volumes:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  postgres-backups:
