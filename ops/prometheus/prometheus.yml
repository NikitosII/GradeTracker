global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: edutrack
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]

  # Fallback: scrape the apps directly (pull-based, no collector needed). To use
  # this instead, remove the `edutrack` job above and uncomment these. The apps
  # always expose :9464/metrics as long as Observability__PrometheusEnabled=true.
  # - job_name: bot-web
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["bot-web:9464"]
  # - job_name: bot-worker
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["bot-worker:9464"]
