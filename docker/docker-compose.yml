name: edutrack

services:
  bot-web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: edutrack/bot-web:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN}"
      Telegram__WebhookSecret: "${TELEGRAM_WEBHOOK_SECRET}"
      Telegram__WebhookUrl: "${TELEGRAM_WEBHOOK_URL}"
      Bootstrap__AdminInviteCode: "${BOOTSTRAP_ADMIN_CODE}"
      Observability__PrometheusEnabled: "true"
      Observability__PrometheusHttpListenerPrefix: "http://+:9464/"
      Observability__OtlpEndpoint: "${OTLP_ENDPOINT}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  bot-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: edutrack/bot-worker:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN}"
      Telegram__WebhookSecret: "${TELEGRAM_WEBHOOK_SECRET}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "${RABBITMQ_USER}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD}"
      Notifications__QuietHoursStart: "22"
      Notifications__QuietHoursEnd: "8"
      Observability__PrometheusEnabled: "true"
      Observability__PrometheusHttpListenerPrefix: "http://+:9464/"
      Observability__OtlpEndpoint: "${OTLP_ENDPOINT}"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:
  rabbitmq-data:
