# Promtail tails the Docker container logs (via the Docker socket) and ships them
# to Loki. It keeps only this project's containers and labels each line with the
# Compose service name. The app logs as JSON (CompactJsonFormatter), so TraceId
# is available for trace-to-logs correlation via `| json | TraceId="..."`.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: edutrack-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only this Compose project's containers.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'edutrack'
        action: keep
      # A stable job label for the trace-to-logs query stream selector.
      - target_label: 'job'
        replacement: 'edutrack'
      # Per-service label (bot-web, bot-worker, ...).
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
    pipeline_stages:
      # Promote the Serilog level to a label (low cardinality); TraceId stays a
      # parsed field, queried on demand, to keep label cardinality sane.
      - json:
          expressions:
            level: '"@l"'
      - labels:
          level:
